<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SilverScroll">
<link rel="apple-touch-icon" href="images/silver-face.png">
<title>SilverScroll prototype</title>
<!--
  SilverScroll · 50.006 Group 6 · interactive hi-fi prototype
  Keep this file next to the images/ folder and open it in Chrome, Safari or Edge.
  Open one screen directly with ?screen=NAME, e.g. index.html?screen=tutLike
  Screens: login, s2, s3, elderlyPopup, setup, tour, feedStandard, feed, feedZh, language, panel, listening,
           typing, notCaught2, tutLike, tutDone, explainFalse, shareWarn, shareAI, silverOff, menu, tutComment
  Language: English and 中文 work (Menu > Language / 语言, or the globe button on the log-in screen).
  Silver's words light up one by one while Silver reads aloud (turn on "Silver reads out loud").
  Phone only (no demo panel): add ?panel=off
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
html,body{height:100%}
body{margin:0;background:#ECE7DC;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
/* phones: fill the whole screen (width stays 390 so tutorial spotlights line up; height follows the screen) */
body.fluid [data-phone]{height:var(--ph) !important}
body.fluid [aria-modal="true"], body.fluid [role="alertdialog"], body.fluid [aria-label="Silver tour"], body.fluid [aria-label="Silver guided tutorial"]{max-height:calc(var(--ph) - 36px); overflow-y:auto}

body{margin:0}
a{color:#263D38}a:hover{color:#11201C}
@keyframes ssRing{0%{box-shadow:0 0 0 0 rgba(224,169,69,.9)}70%{box-shadow:0 0 0 14px rgba(224,169,69,0)}100%{box-shadow:0 0 0 0 rgba(224,169,69,0)}}
@keyframes ssMic{0%{box-shadow:0 0 0 0 rgba(198,40,40,.55)}100%{box-shadow:0 0 0 36px rgba(198,40,40,0)}}
@keyframes ssWarn{0%,100%{border-color:#C2410C}50%{border-color:#FDBA74}}
@keyframes ssNudge{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,6px)}}
@keyframes ssUp{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes ssFade{from{opacity:0}to{opacity:1}}
@keyframes ssBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes ssPop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.sv-scroll{scrollbar-width:auto;scrollbar-color:#B07D22 #EFE5CF}
.sv-scroll::-webkit-scrollbar{width:12px}
.sv-scroll::-webkit-scrollbar-track{background:#EFE5CF;border-radius:8px}
.sv-scroll::-webkit-scrollbar-thumb{background:#B07D22;border-radius:8px;border:2px solid #EFE5CF}
.ss-feed{scrollbar-width:none}
.ss-feed::-webkit-scrollbar{width:0;height:0}
.ss-btn:focus-visible,.ss-input:focus-visible{outline:3px solid #E0A945;outline-offset:2px}

</style>

<body>
<div id="wrap"><div id="stage"></div></div>
<template id="dc-template">

<div data-uid="{{uid}}" style="box-sizing:border-box; font-family:'Atkinson Hyperlegible', 'Noto Sans SC', system-ui, sans-serif; {{rootCss}}">

<div data-phone="1" lang="{{langAttr}}" style="position:relative; flex:none; width:390px; height:844px; overflow:hidden; background:{{ui.pageBg}}; color:{{ui.text}}; font-family:{{ui.font}}; {{phoneCss}}">

<!-- ============ LOGIN ============ -->
<sc-if value="{{loginOn}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute; inset:0; background:#FFFFFF; display:flex; flex-direction:column; padding:64px 28px 28px; box-sizing:border-box; font-family:'Atkinson Hyperlegible', 'Noto Sans SC', system-ui, sans-serif; z-index:20">
  <button class="ss-btn" onClick="{{openLang}}" aria-label="{{T.langAria}}" style="position:absolute; top:12px; right:14px; display:flex; align-items:center; gap:8px; height:48px; padding:0 16px 0 12px; border-radius:24px; border:2px solid #C3CBD4; background:#FFFFFF; color:#1C1E21; font-size:17px; font-weight:700; font-family:inherit; cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>{{langName}}</button>
  <div style="font-size:50px; font-weight:700; color:#2D5BE3; letter-spacing:-1.5px; line-height:1">kampung</div>
  <p style="margin:12px 0 34px; font-size:20px; line-height:1.4; color:#47505C">{{T.tagline}}</p>
  <label for="{{uid}}-email" style="font-size:18px; font-weight:700; color:#1C1E21">{{T.emailLabel}}</label>
  <input id="{{uid}}-email" class="ss-input" value="{{email}}" onChange="{{onEmail}}" style="margin:8px 0 20px; height:60px; border:2px solid #8C96A3; border-radius:14px; padding:0 16px; font-size:20px; font-family:inherit; color:#1C1E21; background:#FFFFFF">
  <label for="{{uid}}-pw" style="font-size:18px; font-weight:700; color:#1C1E21">{{T.pwLabel}}</label>
  <input id="{{uid}}-pw" class="ss-input" type="password" value="{{pw}}" onChange="{{onPw}}" style="margin:8px 0 24px; height:60px; border:2px solid #8C96A3; border-radius:14px; padding:0 16px; font-size:20px; font-family:inherit; color:#1C1E21; background:#FFFFFF">

      <span style="font-size:16px; color:#3F4F4A">{{T.askShow}}</span>
    </span>
  </button>
  <!-- LOGIN guided tutorial: Silver points at each box, like the Like tutorial -->
  <sc-if value="{{lv.on}}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute; inset:0; z-index:5">
    <div style="position:absolute; inset:0"></div>

        <button class="ss-btn" onClick="{{loginTutExit}}" aria-label="{{T.stopTut}}" style="flex:none; width:52px; height:52px; border-radius:50%; border:2px solid #263D38; background:#FFFFFF; color:#263D38; cursor:pointer; display:flex; align-items:center; justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>

      </sc-if>
    </div>
  </div>
  </sc-if>
</div>
</sc-if>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.uid = 'ss' + Math.random().toString(36).slice(2, 9);
    this.timers = [];
    this.karaGen = 0; this.karaMap = {}; this.karaT = null; this.karaBound = false; this._tok = {};
    this.state = this.initState((props && props.start) || 'login');
  }

  componentDidMount() {
    try { const ss = window.speechSynthesis; if (ss) { ss.getVoices(); ss.onvoiceschanged = () => ss.getVoices(); } } catch (e) {}
    this.afterStart((this.props && this.props.start) || 'login');
  }
  componentDidUpdate(prev) { if (prev && prev.start !== this.props.start) this.start(this.props.start || 'login'); }
  componentWillUnmount() {
    this.clearTimers();
    if (this.scrollT) clearTimeout(this.scrollT);
    if (this.toastT) clearTimeout(this.toastT);
    this.hush(true);
  }

  // ---------- helpers ----------
  later(fn, ms) {
    const t = setTimeout(() => { this.timers = this.timers.filter(x => x !== t); fn(); }, ms);
    this.timers.push(t);
    return t;
  }
  clearTimers() { this.timers.forEach(t => clearTimeout(t)); this.timers = []; }
  isGallery() { return this.props && this.props.panel === 'off'; }
  root() { return document.querySelector('[data-uid="' + this.uid + '"]'); }
  q(sel) { const r = this.root(); return r ? r.querySelector(sel) : null; }
  qa(sel) { const r = this.root(); return r ? Array.prototype.slice.call(r.querySelectorAll(sel)) : []; }
  feedEl() { return this.q('[data-feed]'); }
  rectOf(el) {
    const ph = this.q('[data-phone]');
    if (!el || !ph) return null;
    const p = ph.getBoundingClientRect(), r = el.getBoundingClientRect();
    const k = (p.width / 390) || 1;
    return { x: (r.left - p.left) / k, y: (r.top - p.top) / k, w: r.width / k, h: r.height / k };
  }
  nearestPost(onlyLabelled) {
    const sc = this.feedEl();
    if (!sc) return onlyLabelled ? null : 'p1';
    const c = this.rectOf(sc);
    const mid = c.y + c.h * 0.45;
    let best = null, bd = 1e9;
    this.qa('[data-post]').forEach(el => {
      if (onlyLabelled && !el.getAttribute('data-label')) return;
      const r = this.rectOf(el);
      if (r.y + r.h < c.y + 20 || r.y > c.y + c.h - 20) return;
      const d = Math.abs(r.y + r.h / 2 - mid);
      if (d < bd) { bd = d; best = el.getAttribute('data-post'); }
    });
    return best || (onlyLabelled ? null : 'p1');
  }
  scrollToPost(id, instant) {
    const sc = this.feedEl(), el = this.q('[data-post="' + id + '"]');
    if (!sc || !el) return;
    const top = Math.max(0, el.offsetTop - 12);
    if (instant) sc.scrollTop = top; else sc.scrollTo({ top: top, behavior: 'smooth' });
  }

  // ---------- language ----------
  T() { return SS_STR[(this.state && this.state.lang) || 'en'] || SS_STR.en; }
  zh() { return !!(this.state && this.state.lang === 'zh'); }
  fmt(str, o) { return String(str).replace(/\{(\w+)\}/g, (m, k) => (o && o[k] != null) ? String(o[k]) : m); }
  firstName(p) { return this.zh() && p.firstZh ? p.firstZh : p.first; }
  setLang(code) {
    if (code === 'ms' || code === 'ta') { this.setState({ langSoon: code }); return; }
    if (code !== this.state.lang) this.hush();
    this.setState({ lang: code, langSoon: null });
  }

  // ---------- Silver's voice + karaoke captions ----------
  // say() takes the same strings that are on screen. Each string is spoken as its own
  // utterance; while it is spoken, the word being said lights up wherever K(text) renders it.
  // Word timing comes from the voice's word-boundary events; voices that send none use an estimate.
  tok(text) {
    text = String(text || '');
    if (this._tok[text]) return this._tok[text];
    let plain = '', b = false; const bold = [];
    for (const ch of text) { if (ch === '*') { b = !b; continue; } plain += ch; for (let k = 0; k < ch.length; k++) bold.push(b); }
    const re = /\s+|[㐀-鿿豈-﫿]|[^\s㐀-鿿豈-﫿]+/g;
    const raw = []; let m;
    while ((m = re.exec(plain))) raw.push({ t: m[0], s: m.index, sp: /^\s+$/.test(m[0]) });
    const isP = t => /^[\p{P}\p{S}]+$/u.test(t);
    const OPEN = /^[“‘「『（(《]+$/;
    const units = [];
    for (let i = 0; i < raw.length; i++) {
      const r = raw[i];
      if (!r.sp && isP(r.t) && OPEN.test(r.t) && raw[i + 1] && !raw[i + 1].sp) { raw[i + 1] = { t: r.t + raw[i + 1].t, s: r.s, sp: false }; continue; }
      const prev = units[units.length - 1];
      if (!r.sp && isP(r.t) && prev && !prev.sp) { prev.t += r.t; continue; }
      units.push(r);
    }
    const words = [];
    units.forEach(u => { u.b = !!bold[u.s]; if (!u.sp) { u.wi = words.length; words.push({ t: u.t, s: u.s }); } });
    return (this._tok[text] = { plain: plain, units: units, words: words });
  }
  K(text) {
    const tk = this.tok(text);
    const has = this.karaMap && Object.prototype.hasOwnProperty.call(this.karaMap, text);
    const off = has ? this.karaMap[text] : -1;
    const cur = this.state.karaIdx;
    return tk.units.map(u => {
      let css = 'border-radius:6px' + (u.b ? '; font-weight:700' : '');
      if (!u.sp && has && cur >= 0 && off + u.wi === cur) css += '; background:#E0A945; color:#1C2B27; box-shadow:0 0 0 3px #E0A945';
      return { t: u.t, css: css };
    });
  }
  pickVoice(zh) {
    try {
      const vs = window.speechSynthesis.getVoices() || [];
      const pick = re => vs.filter(v => re.test(v.lang)).sort((a, b) => (b.localService ? 1 : 0) - (a.localService ? 1 : 0))[0];
      return zh ? (pick(/^zh[-_](CN|SG|Hans)/i) || pick(/^(zh|cmn)/i) || null) : (pick(/^en[-_]GB/i) || null);
    } catch (e) { return null; }
  }
  wordAt(words, ci) { let i = -1; for (let k = 0; k < words.length; k++) { if (words[k].s <= ci) i = k; else break; } return i; }
  wordMs(t) {
    const han = (t.match(/[㐀-鿿]/g) || []).length;
    const last = t.slice(-1);
    const pause = /[.!?。！？…]/.test(last) ? 320 : (/[,;:，、；：]/.test(last) ? 180 : 0);
    const base = han ? 245 * han : 120 + 58 * t.replace(/[^A-Za-z0-9]/g, '').length;
    return (base + pause) / 0.9;
  }
  setKara(i) { if (this.state.karaIdx !== i) this.setState({ karaIdx: i }); }
  karaRun(gen, it, i) {
    if (this.karaT) clearTimeout(this.karaT);
    if (gen !== this.karaGen || this.karaBound || i >= it.words.length - 1) return;
    this.karaT = setTimeout(() => {
      if (gen !== this.karaGen || this.karaBound) return;
      this.setKara(it.off + i + 1);
      this.karaRun(gen, it, i + 1);
    }, this.wordMs(it.words[i].t));
  }
  hush(noState) {
    this.karaGen++;
    if (this.karaT) { clearTimeout(this.karaT); this.karaT = null; }
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    if (!noState && this.state && (this.state.karaIdx !== -1 || this.state.talking)) this.setState({ karaIdx: -1, talking: false });
  }
  say(parts) {
    if (typeof parts === 'string') parts = [parts];
    parts = (parts || []).filter(Boolean);
    if (!parts.length) return;
    this.lastSaid = parts;
    if (!this.state.speak) { if (this.state.talking) this.hush(); return; }
    this.hush();
    try {
      const ss = window.speechSynthesis;
      if (!ss) return;
      const gen = this.karaGen;
      const zh = this.zh();
      const voice = this.pickVoice(zh);
      const map = {}; let off = 0;
      const plan = parts.map(p => { const tk = this.tok(p); if (!(p in map)) map[p] = off; const it = { text: tk.plain, off: map[p], words: tk.words }; off += tk.words.length; return it; });
      this.karaMap = map;
      plan.forEach((it, pi) => {
        const u = new SpeechSynthesisUtterance(it.text);
        u.rate = 0.9; u.lang = zh ? 'zh-CN' : 'en-GB';
        if (voice) u.voice = voice;
        u.onstart = () => { if (gen !== this.karaGen) return; this.karaBound = false; if (!this.state.talking) this.setState({ talking: true }); this.setKara(it.off); this.karaRun(gen, it, 0); };
        u.onboundary = e => {
          if (gen !== this.karaGen || (e.name && e.name !== 'word')) return;
          this.karaBound = true;
          const i = this.wordAt(it.words, e.charIndex);
          if (i >= 0) this.setKara(it.off + i);
        };
        const end = () => { if (gen !== this.karaGen) return; if (pi === plan.length - 1) { if (this.karaT) clearTimeout(this.karaT); this.setState({ karaIdx: -1, talking: false }); } };
        u.onend = end; u.onerror = end;
        ss.speak(u);
      });
    } catch (e) {}
  }
  toastMsg(text) {
    if (this.toastT) clearTimeout(this.toastT);
    this.setState({ toast: text });
    this.toastT = setTimeout(() => this.setState({ toast: null }), 3400);
  }
  data() {
    if (this._d) return this._d;
    this._d = {
      img: {
        face: 'images/silver-face.png',
        point: 'images/silver-point.png',
        wing: 'images/silver-wing.png',
        confused: 'images/silver-confused.png',
        curious: 'images/silver-curious.png',
        listen: 'images/silver-listen.png',

  // ---------- scenarios ----------
  initState(key) {
    const prev = this.state || {};
    const s = {
      screen: 'app', elderly: false, popup: null, setup: false, setupFromMenu: false, skipSetup: false,
      tour: null, tourRect: null, menu: false, panel: null, heardText: '', attempts: 0,
      voiceResult: prev.voiceResult || 'like', typed: '', typeMsg: false, recent: [],
      tut: null, tutDone: null, explain: null, shareCheck: null, shareSheet: null,
      comments: null, commentText: '', liked: {}, extra: {}, toast: null, offBanner: false, greet: false,
      textSize: 'L', contrast: false, zoomTap: true, zoomed: null, scrolling: false, pulseHeader: false,
      loginTut: null, email: 'meiling.wong@mail.com', pw: 'silverscroll', speak: !!prev.speak,
      lang: prev.lang || 'en', langSheet: false, langSoon: null, karaIdx: -1, talking: false,
      autoMishear: false, heardOnce: false, curVoice: null
    };
    // recent questions: { intent } = one of Silver's own questions (shown in the current language), { intent, text } = typed by the user
    const seeded = [{ intent: 'like' }, { intent: 'share' }, { intent: 'label' }];
    switch (key) {
      case 'login': s.screen = 'login'; break;
      case 's4': s.screen = 'login'; s.lang = 'zh'; break; // Task 4: phone set to Chinese, so the app starts in 中文
      case 's2': s.popup = 'elderly'; s.skipSetup = true; s.recent = seeded; s.voiceResult = 'like'; s.autoMishear = this.isGallery(); break;
      case 's3': s.popup = 'elderly'; s.skipSetup = true; s.recent = seeded; s.voiceResult = 'comment'; break;
      case 'elderlyPopup': s.popup = 'elderly'; break;
      case 'setup': s.elderly = true; s.setup = true; break;
      case 'tour': s.elderly = true; s.tour = 0; break;
      case 'feedStandard': break;
      case 'feed': s.elderly = true; s.recent = seeded; break;
      case 'feedZh': s.elderly = true; s.recent = seeded; s.lang = 'zh'; break;
      case 'language': s.elderly = true; s.langSheet = true; break;
      case 'panel': s.elderly = true; s.panel = 'home'; s.recent = seeded; break;
      case 'listening': s.elderly = true; s.panel = 'listening'; s.heardText = this.T.call({ state: s }).phrases.like.slice(0, 15); s.recent = seeded; break;
      case 'typing': s.elderly = true; s.panel = 'typing'; s.recent = seeded; break;
      case 'notCaught2': s.elderly = true; s.panel = 'fail2'; s.attempts = 2; s.recent = seeded; break;
      case 'tutLike': s.elderly = true; break;
      case 'tutComment': s.elderly = true; break;
      case 'tutDone': s.elderly = true; s.liked = { p1: true }; s.tutDone = { kind: 'like', post: 'p1' }; break;
      case 'explainFalse': s.elderly = true; s.explain = 'p4'; break;
      case 'shareWarn': s.elderly = true; s.shareCheck = 'p4'; break;
      case 'shareAI': s.elderly = true; s.shareCheck = 'p3'; break;
      case 'silverOff': s.offBanner = true; s.pulseHeader = true; break;
      case 'menu': s.elderly = true; s.menu = true; break;
      default: s.screen = 'login';
    }
    return s;
  }
  afterStart(key) {
    if (key === 'tutLike') this.later(() => this.startTutorial('like', 'p1'), 300);
    else if (key === 'tutComment') this.later(() => {
      this.scrollToPost('p5', true);
      this.setState({ comments: 'p5', tut: { kind: 'comment', step: 2, post: 'p5', rect: null } });
      this.later(() => this.measureTut(), 450);
    }, 300);
    else if (key === 'explainFalse' || key === 'shareWarn') this.later(() => this.scrollToPost('p4', true), 80);
    else if (key === 'shareAI') this.later(() => this.scrollToPost('p3', true), 80);
    else if (key === 'tour') this.later(() => this.measureTour(), 300);
    else if (key === 'silverOff' && !this.isGallery()) this.later(() => this.setState({ pulseHeader: false }), 7000);
  }
  start(key) {
    this.clearTimers();
    this.hush();
    const sc = this.feedEl();
    if (sc) sc.scrollTop = 0;
    this.setState(this.initState(key), () => this.afterStart(key));
  }

  // ---------- Elderly Mode on / off ----------
  // set up now comes first (right after log in), so turning Silver on here goes straight to the tour
  enableFromOffer() {
    this.setState({ elderly: true, popup: null, offBanner: false, pulseHeader: false });
    this.later(() => this.goTour(0), 250);
  }
  setupDone() {
    const fromMenu = this.state.setupFromMenu;
    this.setState({ setup: false });
    if (fromMenu) return;
    if (this.state.elderly) this.later(() => this.goTour(0), 200);
    else this.later(() => this.setState({ popup: 'elderly' }), 200);
  }
  notNow() {
    this.setState({ popup: null, elderly: false, offBanner: true, pulseHeader: true, panel: null });
    this.say([this.T().offTitle, this.T().offBody]);
    this.later(() => this.setState({ pulseHeader: false }), 7000);
  }
  // Every time Silver is turned on, the starting tour plays (it covers customising and turning Silver on/off).
  // The one exception is the "How to turn on and off Silver" tutorial, which ends with its own Well done.
  turnOn() {
    const t = this.state.tut;
    this.clearTimers();
    this.setState({ elderly: true, popup: null, offBanner: false, pulseHeader: false, greet: false, menu: false });
    if (t && t.kind === 'onoff') { this.finishTut('onoff', null); return; }
    this.later(() => this.goTour(0), 250);
  }
  turnOff() {
    const t = this.state.tut;
    this.clearTimers();
    if (t && t.kind === 'onoff') {
      // stay in the tutorial: next step points at the (now "Silver off") button to turn it back on
      this.setState({ elderly: false, popup: null, panel: null, offBanner: false, pulseHeader: false, menu: false, greet: false, tut: Object.assign({}, t, { step: 3, rect: null }) });
      this.later(() => { this.measureTut(); this.sayTut(); }, 380);
      return;
    }
    this.setState({ elderly: false, popup: null, panel: null, offBanner: true, pulseHeader: true, menu: false, greet: false });
    this.say([this.T().offTitle, this.T().offBody]);
    this.later(() => this.setState({ pulseHeader: false }), 7000);
  }
  // closing a turn on/off popup without choosing: during the on/off tutorial, go back to the step that points at the button
  popupCancel() {
    const t = this.state.tut;
    this.setState({ popup: null });
    if (t && t.kind === 'onoff' && (t.step === 2 || t.step === 4)) {
      this.setState({ tut: Object.assign({}, t, { step: t.step - 1, rect: null }) });
      this.later(() => { this.measureTut(); this.sayTut(); }, 60);
    }
  }

  // ---------- tour ----------
  tourSteps() {
    const I = this.data().img, T = this.T();
    const meta = [
      { img: I.point, sel: '[data-fab]', card: 'top:96px' },
      { img: I.point, sel: '[data-hdr-silver]', card: 'top:120px' },
      { img: I.point, sel: '[data-menu-btn]', card: 'top:120px' },
      { img: I.listen, sel: null, card: 'top:150px' },
      { img: I.warning, sel: null, card: 'top:150px' }
    ];
    return meta.map((m, i) => {
      const c = T.tour[i];
      const parts = i === 4 ? [c.title, c.body, T.aiBadge, T.tourAi, T.falseBadge, T.tourWarn] : [c.title, c.body];
      return Object.assign({}, m, { title: c.title, body: c.body, parts: parts });
    });
  }
  goTour(i) {
    if (i < 0) i = 0;
    if (i > 4) { this.endTour(); return; }
    const st = this.tourSteps()[i];
    this.setState({ tour: i, tourRect: null, scrolling: false, panel: null });
    this.later(() => this.measureTour(), 380);
    this.say(st.parts);
  }
  measureTour() {
    const i = this.state.tour;
    if (i === null || i === undefined) return;
    const sel = this.tourSteps()[i].sel;
    this.setState({ tourRect: sel ? this.rectOf(this.q(sel)) : null });
  }
  endTour() { this.setState({ tour: null, tourRect: null }); }

  // ---------- panel / voice / typing ----------
  startListening() {
    this.clearTimers();
    this.hush();
    // Task 2 on the phone (no demo panel): Silver hears "How do I like a post?" once, then mishears every time after
    const vr = (this.state.autoMishear && this.state.heardOnce) ? 'fail' : this.state.voiceResult;
    const phrase = this.T().phrases[vr];
    const zh = this.zh();
    const words = zh ? Array.from(phrase) : phrase.split(' ');
    const step = zh ? 190 : 330;
    this.setState({ panel: 'listening', heardText: '', typeMsg: false, curVoice: vr });
    words.forEach((w, i) => this.later(() => this.setState({ heardText: words.slice(0, i + 1).join(zh ? '' : ' ') }), 700 + i * step));
    this.later(() => this.finishListening(), 700 + words.length * step + 900);
  }
  finishListening() {
    if (this.state.panel !== 'listening') return;
    this.clearTimers();
    const vr = this.state.curVoice || this.state.voiceResult, T = this.T();
    if (this.state.autoMishear && vr !== 'fail') this.setState({ heardOnce: true });
    if (vr === 'fail') {
      const a = this.state.attempts + 1;
      this.setState({ attempts: a, panel: a >= 2 ? 'fail2' : 'fail1' });
      this.say(a >= 2 ? T.fail2 : [T.fail1Title, T.fail1Sub]);
    } else {
      this.ask(vr, T.phrases[vr], true);
    }
  }
  // "Too noisy? Type instead" (listening) and "Type or pick a question instead" (missed once) both land here.
  switchToTyping() {
    this.clearTimers();
    this.hush();
    this.setState({ panel: 'typing', typeMsg: false, heardText: '' });
    this.later(() => { const i = this.q('[data-typebox]'); if (i) i.focus(); }, 120);
  }
  ask(intent, text, canon) {
    const entry = canon ? { intent: intent } : { intent: intent, text: text };
    const keyOf = r => r.text || ('#' + r.intent);
    const rec = [entry].concat(this.state.recent.filter(r => keyOf(r) !== keyOf(entry))).slice(0, 3);
    const keepRecent = (intent === 'tour' || intent === 'textsize') ? this.state.recent : rec;
    this.setState({ recent: keepRecent, attempts: 0, typed: '', typeMsg: false });
    if (intent === 'like' || intent === 'comment' || intent === 'share' || intent === 'onoff') {
      this.setState({ panel: 'heard', heardText: text });
      this.say(this.T().showYou);
      this.later(() => this.startTutorial(intent), 1800);
      return;
    }
    if (intent === 'label') {
      const id = this.nearestPost(true);
      this.setState({ panel: null, explain: id || 'labels' });
      this.sayExplain(id || 'labels');
      return;
    }
    if (intent === 'tour') { this.setState({ panel: null }); this.goTour(0); return; }
    if (intent === 'textsize') { this.setState({ panel: null, setup: true, setupFromMenu: true }); return; }
  }
  sendTyped() {
    const raw = (this.state.typed || '').trim();
    const t = raw.toLowerCase();
    if (!t) return;
    const text = raw.charAt(0).toUpperCase() + raw.slice(1);
    const has = (en, zh) => en.test(t) || zh.test(raw);
    let intent = null;
    if (has(/label|red|ai\b|fake|real|true|false|scam/, /标签|红|假|真|骗|人工智能/)) intent = 'label';
    else if (has(/comment|wish|write|reply/, /评论|留言|写|回复|祝/)) intent = 'comment';
    else if (has(/share|send|forward/, /分享|转发|发给|传/)) intent = 'share';
    else if (has(/like|thumb/, /赞|喜欢/)) intent = 'like';
    else if (has(/turn (silver )?(on|off)|switch (silver )?(on|off)|on and off|on\/off|disable|enable/, /打开|关掉|关闭|开关|关了/)) intent = 'onoff';
    else if (has(/big|size|see|font|read/, /大|字体|看不清/)) intent = 'textsize';
    else if (has(/silver|tour|how to use/, /介绍|怎么用|教我/)) intent = 'tour';
    if (!intent) {
      this.setState({ typeMsg: true, typed: '', panel: this.state.panel === 'typing' ? 'typing' : 'home' });
      this.say(this.T().typeMsg);
      return;
    }
    this.ask(intent, text, false);
  }

  // ---------- tutorials ----------
  startTutorial(kind, forced) {
    this.clearTimers();
    if (kind === 'onoff') {
      // points at the Silver button at the top; the user really turns Silver off, then back on
      this.setState({ panel: null, tut: { kind: 'onoff', step: 0, post: null, rect: null }, tutDone: null, comments: null, shareSheet: null, shareCheck: null, explain: null, menu: false, zoomed: null, popup: null, offBanner: false, greet: false });
      this.later(() => { this.measureTut(); this.sayTut(); }, 60);
      return;
    }
    const id = forced || this.nearestPost(false);
    this.setState({ panel: null, tut: { kind: kind, step: 0, post: id, rect: null }, tutDone: null, comments: null, shareSheet: null, shareCheck: null, explain: null, menu: false, zoomed: null });
    this.later(() => {
      const sc = this.feedEl();
      const btn = this.q('[data-post="' + id + '"] [data-act="' + kind + '"]');
      if (sc && btn) {
        const r = this.rectOf(btn);
        sc.scrollTo({ top: Math.max(0, sc.scrollTop + (r.y - 560)), behavior: 'smooth' });
      }
      this.later(() => { this.measureTut(); this.sayTut(); }, 520);
    }, 40);
  }
  measureTut() {
    const t = this.state.tut;
    if (!t) return;
    let el = null;
    if (t.kind === 'onoff') el = (t.step === 2 || t.step === 4) ? null : this.q('[data-hdr-silver]');
    else if (t.step <= 1) el = this.q('[data-post="' + t.post + '"] [data-act="' + t.kind + '"]');
    else if (t.kind === 'comment' && t.step === 2) el = this.q('[data-cinput]');
    this.setState({ tut: Object.assign({}, t, { rect: this.rectOf(el) }) });
  }
  tutCopy(t) {
    const T = this.T(), k = t.kind, s = t.step;
    if (k === 'onoff') {
      // steps 2 and 4 are the popups (Silver's hint shows inside them); the card shows 3 steps
      const i = [0, 1, 1, 2, 2][Math.min(s, 4)];
      const hint = s === 2 ? T.onoffHintOff : (s === 4 ? T.onoffHintOn : null);
      const c = T.tut.onoff[i];
      return { title: hint ? '' : c[0], body: hint || c[1], stepText: this.fmt(T.stepOf, { a: i + 1, b: 3 }) };
    }
    const total = k === 'comment' ? 3 : 2;
    const c = (T.tut[k] || T.tut.like)[Math.min(s, total - 1)];
    return { title: c[0], body: c[1], stepText: this.fmt(T.stepOf, { a: Math.min(s, total - 1) + 1, b: total }) };
  }
  sayTut() { const t = this.state.tut; if (!t) return; const c = this.tutCopy(t); this.say([c.title, c.body].filter(Boolean)); }
  tutHoleTap() {
    const t = this.state.tut;
    if (!t) return;
    if (t.kind === 'onoff') {
      if (t.step !== 1 && t.step !== 3) return;
      const off = t.step === 1;
      this.setState({ tut: Object.assign({}, t, { step: t.step + 1, rect: null }), popup: off ? 'confirmOff' : 'confirmOn' });
      this.say(off ? this.T().onoffHintOff : this.T().onoffHintOn);
      return;
    }
    if (t.kind === 'like') {
      const liked = Object.assign({}, this.state.liked); liked[t.post] = true;
      this.setState({ liked: liked, tut: null, tutDone: { kind: 'like', post: t.post } });
      this.sayDone('like', t.post);
      return;
    }
    if (t.kind === 'comment') {
      if (t.step <= 1) {
        this.setState({ comments: t.post, commentText: '', tut: Object.assign({}, t, { step: 2, rect: null }) });
        this.later(() => { this.measureTut(); this.sayTut(); }, 450);
        return;
      }
      this.setState({ tut: Object.assign({}, t, { step: 3, rect: null }) });
      this.say(this.T().commentHint);
      this.later(() => { const i = this.q('[data-cinput]'); if (i) i.focus(); }, 80);
      return;
    }
    if (t.kind === 'share') {
      const p = this.post(t.post);
      const flagged = this.state.elderly && p.label;
      this.setState({ tut: Object.assign({}, t, { step: 2, rect: null }), shareCheck: flagged ? t.post : null, shareSheet: flagged ? null : t.post });
      if (flagged) this.sayCheck(t.post); else this.say(this.T().shareHint);
    }
  }
  exitTut() {
    const t = this.state.tut;
    this.setState({ tut: null });
    if (t && t.kind === 'onoff' && !this.state.elderly) { this.setState({ offBanner: true }); this.say([this.T().offTitle, this.T().offBody]); }
  }
  doneCopy(kind, postId) {
    const m = this.T().doneMsg[kind] || this.T().doneMsg.like;
    return [m[0], this.fmt(m[1], { name: this.firstName(this.post(postId)) })];
  }
  sayDone(kind, postId) { this.say(this.doneCopy(kind, postId)); }
  finishTut(kind, post) { this.setState({ tut: null, tutDone: { kind: kind, post: post } }); this.sayDone(kind, post); }

  // ---------- login tutorial: Silver points at the email box, the password box, then Log in ----------
  loginTutEl(step) { return step === 0 ? this.q('#' + this.uid + '-email') : (step === 1 ? this.q('#' + this.uid + '-pw') : this.q('[data-login-btn]')); }
  startLoginTut() {
    this.clearTimers();
    this.setState({ loginTut: { step: 0, rect: null } });
    this.later(() => { this.measureLoginTut(); this.sayLoginTut(); }, 60);
  }
  measureLoginTut() {
    const t = this.state.loginTut;
    if (!t) return;
    this.setState({ loginTut: Object.assign({}, t, { rect: this.rectOf(this.loginTutEl(t.step)) }) });
  }
  sayLoginTut() { const t = this.state.loginTut; if (!t) return; const c = this.T().loginTut[t.step]; this.say([c[0], c[1]]); }
  loginTutNext() {
    const t = this.state.loginTut;
    if (!t) return;
    try { if (document.activeElement) document.activeElement.blur(); } catch (e) {}
    if (t.step >= 2) return;
    this.setState({ loginTut: { step: t.step + 1, rect: null } });
    this.later(() => { this.measureLoginTut(); this.sayLoginTut(); }, 30);
  }
  // tapping the lit-up box puts the cursor in it so the user can type; tapping the lit-up Log in logs in
  loginTutHoleTap() {
    const t = this.state.loginTut;
    if (!t) return;
    if (t.step < 2) { const el = this.loginTutEl(t.step); if (el) el.focus(); return; }
    this.doLogin();
  }
  doLogin() {
    this.clearTimers();
    this.hush();
    this.setState({ screen: 'app', popup: null, setup: true, setupFromMenu: false, loginTut: null });
  }

  // ---------- explain / share check ----------
  sayExplain(id) {
    const T = this.T();
    if (id === 'labels') { this.say([T.labelsTitle, T.aiBadge, T.aiMeaning, T.falseBadge, T.warnMeaning, T.tapLabel]); return; }
    const e = T.explain[this.post(id).label === 'false' ? 'warn' : 'ai'];
    this.say([e.title].concat(e.why, e.todo));
  }
  checkCopy(id) { return this.T().check[this.post(id).label === 'false' ? 'warn' : 'ai']; }
  sayCheck(id) { const c = this.checkCopy(id); this.say([c.title, c.body]); }
  dontShare() {
    const id = this.state.shareCheck;
    const t = this.state.tut;
    this.setState({ shareCheck: null });
    if (t && t.kind === 'share') { this.finishTut('shareStop', id); return; }

      typed: s.typed, typeMsg: s.typeMsg, commentText: s.commentText,
      toast: s.toast || '', toastOn: !!s.toast, toastCss: fabOn ? 'bottom:156px' : 'bottom:24px',
      showPanel: panelOn, speak: s.speak, talking: s.talking, notSpeak: !s.speak,
      voiceBtn: s.speak ? { text: T.soundOn, aria: T.soundOnAria, css: 'background:#263D38; color:#FFFFFF' } : { text: T.soundOff, aria: T.soundOffAria, css: 'background:#FFFFFF; color:#263D38' },
      speakUi: s.speak ? { track: 'background:#263D38', knob: 'left:21px' } : { track: 'background:#AEB6C0', knob: 'left:3px' },
      scenarios: [
        { n: '1', t: 'Set up Elderly Mode, first Like', d: 'Easy · starts at log in', go: () => this.start('login') },
        { n: '2', t: 'Catch fake news before sharing', d: 'Hard · Silver mishears twice', go: () => this.start('s2') },
        { n: '3', t: 'Turn Silver back on, comment', d: 'Recover after tapping Not now', go: () => this.start('s3') },
        { n: '4', t: 'Phone set to Chinese', d: 'Like 1, but everything starts in 中文', go: () => this.start('s4') }
      ],
      phoneLangs: [['en', 'English'], ['zh', '中文']].map(l => {
        const sel = s.lang === l[0];
        return { code: l[0], t: l[1], on: sel, pick: () => this.setLang(l[0]), css: sel ? 'border:2px solid #263D38; background:#FFF3D6; color:#1C2B27' : 'border:2px solid #D6CDB8; background:#FFFFFF; color:#1C2B27', dot: sel ? 'border:5px solid #263D38; background:#FFFFFF' : 'border:2px solid #8A9A95; background:#FFFFFF' };
      }),
      voices: [['like', '"' + T.phrases.like + '"'], ['comment', '"' + T.phrases.comment + '"'], ['label', '"' + T.phrases.label + '"'], ['fail', 'Can’t catch it (mumbled)']].map(v => {
        const sel = s.voiceResult === v[0];
        return { t: v[1], on: sel, pick: () => this.setState({ voiceResult: v[0] }), css: sel ? 'border:2px solid #263D38; background:#FFF3D6; color:#1C2B27' : 'border:2px solid #D6CDB8; background:#FFFFFF; color:#1C2B27', dot: sel ? 'border:5px solid #263D38; background:#FFFFFF' : 'border:2px solid #8A9A95; background:#FFFFFF' };
      }),

      // handlers
      onFeedScroll: () => {
        if (!this.state.scrolling) this.setState({ scrolling: true });
        if (this.scrollT) clearTimeout(this.scrollT);
        this.scrollT = setTimeout(() => this.setState({ scrolling: false }), 700);
      },
      // the Silver button at the top only turns Silver on or off (help lives in the Ask Silver button at the bottom)
      headerSilver: () => this.setState({ popup: this.state.elderly ? 'confirmOff' : 'confirmOn', greet: false }),
      openMenu: () => this.setState({ menu: true }),
      closeMenu: () => this.setState({ menu: false }),
      openSetupFromMenu: () => this.setState({ setup: true, setupFromMenu: true }),
      replayTourFromMenu: () => { this.setState({ menu: false, elderly: true }); this.goTour(0); },
      logout: () => this.start('login'),
      openLang: () => this.setState({ langSheet: true, langSoon: null }),
      closeLang: () => this.setState({ langSheet: false, langSoon: null }),
      dismissBanner: () => this.setState({ offBanner: false, pulseHeader: false }),
      undoOff: () => this.turnOn(),
      popupYes: () => {
        const p = this.state.popup;
        if (p === 'elderly') this.enableFromOffer();
        else if (p === 'confirmOn') this.turnOn();
        else this.popupCancel();
      },
      popupNo: () => { if (this.state.popup === 'elderly') this.notNow(); else this.popupCancel(); },
      setupDone: () => this.setupDone(),
      setSizeL: () => this.setState({ textSize: 'L' }),
      setSizeXL: () => this.setState({ textSize: 'XL' }),
      toggleContrast: () => this.setState({ contrast: !this.state.contrast }),
      toggleZoom: () => this.setState({ zoomTap: !this.state.zoomTap, zoomed: null }),
      tourNext: () => this.goTour((this.state.tour || 0) + 1),
      tourBack: () => this.goTour((this.state.tour || 0) - 1),
      tourHoleTap: () => this.goTour(1),
      endTour: () => this.endTour(),
      openPanel: () => this.setState({ panel: 'home', typeMsg: false, greet: false }),
      closePanel: () => { this.clearTimers(); this.setState({ panel: null, typeMsg: false }); },
      backToHome: () => this.setState({ panel: 'home' }),
      startListening: () => this.startListening(),
      stopListening: () => this.finishListening(),
      switchToTyping: () => this.switchToTyping(),
      onType: e => this.setState({ typed: e.target.value }),
      onTypeKey: e => { if (e.key === 'Enter') this.sendTyped(); },
      sendTyped: () => this.sendTyped(),
      tutNext: () => { const tt = this.state.tut; if (!tt) return; this.setState({ tut: Object.assign({}, tt, { step: 1 }) }); this.later(() => this.sayTut(), 30); },
      tutExit: () => this.exitTut(),
      tutHoleTap: () => this.tutHoleTap(),
      // speaker button = switch for "Silver reads out loud" (same setting as in setup)
      sayAgain: () => {
        if (this.state.speak) { this.hush(); this.setState({ speak: false }); this.toastMsg(this.T().voiceOffToast); return; }
        this.setState({ speak: true }, () => {
          if (this.state.loginTut) this.sayLoginTut();
          else if (this.state.tut) this.sayTut();
          else if (this.state.explain) this.sayExplain(this.state.explain);
          else if (this.state.shareCheck) this.sayCheck(this.state.shareCheck);
        });
      },
      closeDone: () => this.setState({ tutDone: null, comments: null, shareSheet: null }),
      watchAgain: () => {
        const d = this.state.tutDone; if (!d) return;
        const kind = d.kind === 'shareStop' ? 'share' : d.kind;
        this.setState({ tutDone: null, comments: null, shareSheet: null });
        this.later(() => this.startTutorial(kind, d.post), 120);
      },
      closeExplain: () => this.setState({ explain: null }),
      closeCheck: () => this.setState({ shareCheck: null }),
      closeShare: () => { const tt = this.state.tut; this.setState({ shareSheet: null, tut: tt && tt.kind === 'share' ? null : tt }); },
      shareFamily: () => this.pickShare('family'),
      shareMine: () => this.pickShare('mine'),
      closeComments: () => { const tt = this.state.tut; this.setState({ comments: null, tut: tt && tt.kind === 'comment' ? null : tt }); },
      onCText: e => this.setState({ commentText: e.target.value }),
      onCKey: e => { if (e.key === 'Enter') this.sendComment(); },
      sendComment: () => this.sendComment(),
      micComment: () => { const p = this.post(this.state.comments); this.setState({ commentText: p.micText ? p.micText[L] : T.defaultMic }); this.toastMsg(this.T().micToast); },
      back: () => this.back(),
      reset: () => this.start((this.props && this.props.start) || 'login'),
      toggleSpeak: () => { const v = !this.state.speak; if (!v) this.hush(); this.setState({ speak: v }); }
    };
  }
}

</script>
<script>

(function () {
  // Real base class: Preact component whose render() runs the template.
  var Base = function (props) { preact.Component.call(this, props); };
  Base.prototype = Object.create(preact.Component.prototype);
  Base.prototype.constructor = Base;
  Base.prototype.render = function () { return window.__dcBuild(this.renderVals()); };
  Object.setPrototypeOf(Component.prototype, Base.prototype);
  Object.setPrototypeOf(Component, Base);

  var q = new URLSearchParams(location.search);
  var small = window.innerWidth < 700;
  // let fit() rerun when the phone rotates or Safari's toolbar changes size
  var panel = q.get('panel') || (small ? 'off' : 'on');
  var start = q.get('screen') || 'login';
  var W = panel === 'off' ? 390 : 880, H = panel === 'off' ? 844 : 940;

  var stage = document.getElementById('stage');
  var wrap = document.getElementById('wrap');
  function fit() {
    if (small && panel === 'off') {
      var k = window.innerWidth / 390;
      document.documentElement.style.setProperty('--ph', (window.innerHeight / k) + 'px');
      document.body.classList.add('fluid');
      stage.style.transform = 'scale(' + k + ')';
      wrap.style.width = window.innerWidth + 'px';
      wrap.style.height = window.innerHeight + 'px';
      return;
    }
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    if (panel !== 'off') s = Math.min(s, 1);
    stage.style.transform = 'scale(' + s + ')';
    wrap.style.width = (W * s) + 'px';
    wrap.style.height = (H * s) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
  preact.render(preact.h(Component, { start: start, panel: panel }), stage);
})();

</script>
